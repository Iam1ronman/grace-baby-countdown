<!DOCTYPE html>
<html lang=""en>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Countdown Timer | Javascript</title>
    </head>
    <body>
        <video autoplay muted loop id="bg-video">
            <source src="Stork.mp4" type="video/mp4">
        </video>
        <div class="container">
        <h1>💙Countdown to Cuteness💙</h1>
        <p class="subtitle">Grace's Little Man Arrives In</p>
        <div id="countdown" class="countdown">
            <div class="time">
                <h2 id="days"></h2>
                <small>Days</small>
            </div>
              <div class="time">
                <h2 id="hours"></h2>
                <small>Hours</small>
            </div>
              <div class="time">
                <h2 id="minutes"></h2>
                <small>Minutes</small>
            </div>
             <div class="time">
                <h2 id="seconds"></h2>
                <small>Seconds</small>
            </div>
        </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
